<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/client-masks.js" defer></script>
  </head>
  <body class="bg-slate-50">
    <header class="border-b bg-white"><div class="mx-auto flex max-w-5xl justify-between px-4 py-3"><a href="/admin/clients" class="font-extrabold">Livraria LES</a><a href="/admin/clients" class="text-sm font-semibold text-slate-600">Voltar</a></div></header>
    <main class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="mb-6 text-3xl font-black">Cadastrar cliente</h1>
      <form th:action="@{/admin/clients}" th:object="${clientForm}" method="post" class="space-y-6">
        <p th:if="${formError}" th:text="${formError}" class="rounded-xl border border-rose-200 bg-rose-50 p-3 text-rose-800"></p>
        <section class="rounded-2xl border bg-white p-5">
          <h2 class="font-bold">Dados cadastrais</h2>
          <div class="mt-4 grid gap-3 md:grid-cols-2">
            <input th:field="*{name}" required class="rounded-xl border px-3 py-2" placeholder="Nome">
            <select th:field="*{gender}" required class="rounded-xl border px-3 py-2"><option value="">Gênero</option><option value="Feminino">Feminino</option><option value="Masculino">Masculino</option><option value="Outro">Outro</option></select>
            <input th:field="*{birth}" type="date" required class="rounded-xl border px-3 py-2">
            <input th:field="*{cpf}" data-mask="cpf" inputmode="numeric" maxlength="14" required class="rounded-xl border px-3 py-2" placeholder="CPF (000.000.000-00)">
            <input th:field="*{email}" required type="email" class="rounded-xl border px-3 py-2" placeholder="E-mail">
            <select th:field="*{phoneType}" required class="rounded-xl border px-3 py-2"><option value="">Tipo de telefone</option><option value="Celular">Celular</option><option value="Residencial">Residencial</option><option value="Comercial">Comercial</option></select>
            <input th:field="*{ddd}" required pattern="[0-9]{2}" class="rounded-xl border px-3 py-2" placeholder="DDD">
            <input th:field="*{phoneNumber}" data-mask="phone" inputmode="numeric" maxlength="10" required class="rounded-xl border px-3 py-2" placeholder="Número (00000-0000)">
            <input th:field="*{password}" required type="password" minlength="8" class="rounded-xl border px-3 py-2" placeholder="Senha">
            <input th:field="*{passwordConfirmation}" required type="password" minlength="8" class="rounded-xl border px-3 py-2" placeholder="Confirmação de senha">
          </div>
          <p class="mt-3 text-sm text-slate-600">A senha deve ter ao menos 8 caracteres, letras maiúsculas e minúsculas e um caractere especial.</p>
        </section>
        <section class="rounded-2xl border bg-white p-5">
          <div class="flex items-center justify-between gap-4">
            <h2 class="font-bold">Endereço de entrega</h2>
            <label class="flex items-center gap-2 text-sm font-semibold">
              <input th:field="*{sameAddress}" id="same-address" type="checkbox" class="h-4 w-4">
              Usar também para cobrança
            </label>
          </div>
          <div class="mt-4 grid gap-3 md:grid-cols-2">
            <input th:field="*{deliveryAddress.label}" required class="rounded-xl border px-3 py-2" placeholder="Identificação (ex.: Casa)">
            <select th:field="*{deliveryAddress.residenceType}" required class="rounded-xl border px-3 py-2"><option value="">Tipo de residência</option><option value="Casa">Casa</option><option value="Apartamento">Apartamento</option></select>
            <select th:field="*{deliveryAddress.streetType}" required class="rounded-xl border px-3 py-2"><option value="">Tipo de logradouro</option><option value="Rua">Rua</option><option value="Avenida">Avenida</option><option value="Alameda">Alameda</option><option value="Travessa">Travessa</option><option value="Rodovia">Rodovia</option><option value="Praça">Praça</option></select>
            <input th:field="*{deliveryAddress.street}" required class="rounded-xl border px-3 py-2" placeholder="Logradouro">
            <input th:field="*{deliveryAddress.number}" required class="rounded-xl border px-3 py-2" placeholder="Número">
            <input th:field="*{deliveryAddress.neighborhood}" required class="rounded-xl border px-3 py-2" placeholder="Bairro">
            <input th:field="*{deliveryAddress.cep}" data-mask="cep" inputmode="numeric" maxlength="9" required class="rounded-xl border px-3 py-2" placeholder="CEP (00000-000)">
            <select th:field="*{deliveryAddress.state}" required class="state-select rounded-xl border px-3 py-2"><option value="">Estado</option></select>
            <select th:field="*{deliveryAddress.city}" required class="city-select rounded-xl border px-3 py-2" disabled><option value="">Selecione o estado primeiro</option></select>
            <input th:field="*{deliveryAddress.notes}" class="rounded-xl border px-3 py-2" placeholder="Observações">
          </div>
        </section>
        <section id="billing-section" class="rounded-2xl border bg-white p-5">
          <h2 class="font-bold">Endereço de cobrança</h2>
          <div class="mt-4 grid gap-3 md:grid-cols-2">
            <input th:field="*{billingAddress.label}" required class="rounded-xl border px-3 py-2" placeholder="Identificação (ex.: Trabalho)">
            <select th:field="*{billingAddress.residenceType}" required class="rounded-xl border px-3 py-2"><option value="">Tipo de residência</option><option value="Casa">Casa</option><option value="Apartamento">Apartamento</option></select>
            <select th:field="*{billingAddress.streetType}" required class="rounded-xl border px-3 py-2"><option value="">Tipo de logradouro</option><option value="Rua">Rua</option><option value="Avenida">Avenida</option><option value="Alameda">Alameda</option><option value="Travessa">Travessa</option><option value="Rodovia">Rodovia</option><option value="Praça">Praça</option></select>
            <input th:field="*{billingAddress.street}" required class="rounded-xl border px-3 py-2" placeholder="Logradouro">
            <input th:field="*{billingAddress.number}" required class="rounded-xl border px-3 py-2" placeholder="Número">
            <input th:field="*{billingAddress.neighborhood}" required class="rounded-xl border px-3 py-2" placeholder="Bairro">
            <input th:field="*{billingAddress.cep}" data-mask="cep" inputmode="numeric" maxlength="9" required class="rounded-xl border px-3 py-2" placeholder="CEP (00000-000)">
            <select th:field="*{billingAddress.state}" required class="state-select rounded-xl border px-3 py-2"><option value="">Estado</option></select>
            <select th:field="*{billingAddress.city}" required class="city-select rounded-xl border px-3 py-2" disabled><option value="">Selecione o estado primeiro</option></select>
            <input th:field="*{billingAddress.notes}" class="rounded-xl border px-3 py-2" placeholder="Observações">
          </div>
        </section>
        <button class="rounded-xl bg-slate-900 px-5 py-3 font-bold text-white" type="submit">Cadastrar cliente</button>
      </form>
    </main>
    <script>
      const states = { AC: 'Acre', AL: 'Alagoas', AP: 'Amapá', AM: 'Amazonas', BA: 'Bahia', CE: 'Ceará', DF: 'Distrito Federal', ES: 'Espírito Santo', GO: 'Goiás', MA: 'Maranhão', MT: 'Mato Grosso', MS: 'Mato Grosso do Sul', MG: 'Minas Gerais', PA: 'Pará', PB: 'Paraíba', PR: 'Paraná', PE: 'Pernambuco', PI: 'Piauí', RJ: 'Rio de Janeiro', RN: 'Rio Grande do Norte', RS: 'Rio Grande do Sul', RO: 'Rondônia', RR: 'Roraima', SC: 'Santa Catarina', SP: 'São Paulo', SE: 'Sergipe', TO: 'Tocantins' };
      const stateOptions = Object.entries(states).map(([uf, name]) => `<option value="${uf}">${name} (${uf})</option>`).join('');
      document.querySelectorAll('.state-select').forEach(stateSelect => {
        stateSelect.insertAdjacentHTML('beforeend', stateOptions);
        const citySelect = stateSelect.parentElement.querySelector('.city-select');
        stateSelect.addEventListener('change', async () => {
          citySelect.disabled = true;
          citySelect.innerHTML = '<option value="">Carregando cidades...</option>';
          if (!stateSelect.value) return;
          const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${stateSelect.value}/municipios`);
          const cities = await response.json();
          citySelect.innerHTML = '<option value="">Selecione a cidade</option>' + cities.map(city => `<option value="${city.nome}">${city.nome}</option>`).join('');
          citySelect.disabled = false;
        });
      });

      const sameAddress = document.querySelector('#same-address');
      const billingSection = document.querySelector('#billing-section');
      const billingFields = billingSection.querySelectorAll('input, select');

      sameAddress.addEventListener('change', () => {
        billingSection.hidden = sameAddress.checked;
        billingFields.forEach(field => {
          field.disabled = sameAddress.checked;
          field.required = !sameAddress.checked && field.dataset.optional !== 'true';
        });
      });
    </script>
  </body>
</html>
