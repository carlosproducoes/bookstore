<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Endereços do cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body class="bg-slate-50">
    <header class="border-b bg-white"><div class="mx-auto flex max-w-5xl justify-between px-4 py-3"><a href="/admin/clients" class="font-extrabold">Livraria LES</a><a th:href="@{/admin/clients/{code}(code=${clientCode})}" class="text-sm font-semibold text-slate-600">Voltar ao cliente</a></div></header>
    <main class="mx-auto max-w-5xl px-4 py-8">
      <div class="mb-6 flex items-center justify-between"><h1 class="text-3xl font-black">Endereços</h1><a th:href="@{/admin/clients/{code}/addresses/new(code=${clientCode})}" class="rounded-xl bg-slate-900 px-4 py-3 font-bold text-white">Novo endereço</a></div>
      <p th:if="${formError}" th:text="${formError}" class="mb-4 rounded-xl border border-rose-200 bg-rose-50 p-3 text-rose-800"></p>
      <div class="grid gap-4 md:grid-cols-2">
        <article th:each="address : ${addresses}" class="rounded-2xl border bg-white p-5">
          <div class="flex items-start justify-between gap-3"><div><h2 class="font-bold" th:text="${address.label}">Casa</h2><p class="text-sm text-slate-500"><span th:text="${address.type}">Entrega</span> · <span th:text="${address.residenceType}">Casa</span></p></div><a th:href="@{/admin/clients/{code}/addresses/{id}/edit(code=${clientCode},id=${address.id})}" class="text-sm font-semibold">Editar</a></div>
          <p class="mt-3 text-sm"><span th:text="${address.streetType}">Rua</span> <span th:text="${address.street}">Flores</span>, <span th:text="${address.number}">10</span><br><span th:text="${address.neighborhood}">Centro</span><br><span th:text="${address.cep}">01000-000</span> · <span th:text="${address.city}">Maceió</span>/<span th:text="${address.state}">AL</span><br><span th:text="${address.country}">Brasil</span></p>
          <form th:action="@{/admin/clients/{code}/addresses/{id}/delete(code=${clientCode},id=${address.id})}" method="post" class="mt-4"><button class="text-sm font-semibold text-rose-700">Excluir endereço</button></form>
        </article>
        <p th:if="${#lists.isEmpty(addresses)}" class="rounded-2xl border bg-white p-6 text-slate-500">Nenhum endereço cadastrado.</p>
      </div>
    </main>
  </body>
</html>
