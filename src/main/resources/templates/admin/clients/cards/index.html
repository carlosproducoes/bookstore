<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cartões do cliente</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/css/app.css"></head>
  <body class="bg-slate-50">
    <header class="border-b bg-white"><div class="mx-auto flex max-w-5xl justify-between px-4 py-3"><a href="/admin/clients" class="font-extrabold">Livraria LES</a><a th:href="@{/admin/clients/{code}(code=${clientCode})}" class="text-sm font-semibold text-slate-600">Voltar ao cliente</a></div></header>
    <main class="mx-auto max-w-5xl px-4 py-8">
      <div class="mb-6 flex items-center justify-between"><h1 class="text-3xl font-black">Cartões de crédito</h1><a th:href="@{/admin/clients/{code}/cards/new(code=${clientCode})}" class="rounded-xl bg-slate-900 px-4 py-3 font-bold text-white">Novo cartão</a></div>
      <div class="grid gap-4 md:grid-cols-2">
        <article th:each="card : ${cards}" class="rounded-2xl border bg-white p-5"><div class="flex items-start justify-between"><div><h2 class="font-bold"><span th:text="${card.brand.name}">Visa</span> final <span th:text="${card.lastFour}">1234</span></h2><p class="text-sm text-slate-500" th:text="${card.holderName}">NOME</p></div><span th:if="${card.preferred}" class="rounded-full bg-emerald-100 px-2 py-1 text-xs font-bold text-emerald-800">Preferencial</span></div><div class="mt-4 flex gap-3 text-sm"><a th:href="@{/admin/clients/{code}/cards/{id}/edit(code=${clientCode},id=${card.id})}" class="font-semibold">Editar</a><form th:if="${!card.preferred}" th:action="@{/admin/clients/{code}/cards/{id}/preferred(code=${clientCode},id=${card.id})}" method="post"><button class="font-semibold">Definir como preferencial</button></form><form th:action="@{/admin/clients/{code}/cards/{id}/delete(code=${clientCode},id=${card.id})}" method="post"><button class="font-semibold text-rose-700">Excluir</button></form></div></article>
        <p th:if="${#lists.isEmpty(cards)}" class="rounded-2xl border bg-white p-6 text-slate-500">Nenhum cartão cadastrado.</p>
      </div>
    </main>
  </body>
</html>
