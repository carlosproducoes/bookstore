<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livraria LES</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/app.css">
</head>

<body class="min-h-screen bg-slate-50">

    <main class="mx-auto flex min-h-screen max-w-4xl items-center px-4">
        <div class="w-full text-center">

            <div
                class="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-2xl bg-slate-900 text-2xl font-black text-white">
                L
            </div>

            <h1 class="text-4xl font-black">
                Livraria LES
            </h1>

            <p class="mt-2 text-slate-600">
                Protótipo navegável de e-commerce de livros
            </p>

            <div class="mt-8 grid gap-5 md:grid-cols-2">

                <a
                    href="cliente/home.html"
                    class="rounded-2xl border bg-white p-6 text-left shadow-sm hover:shadow-md"
                >
                    <div class="text-sm text-slate-500">
                        Visão
                    </div>

                    <div class="mt-1 text-2xl font-black">
                        Cliente
                    </div>

                    <p class="mt-2 text-sm text-slate-600">
                        Catálogo, carrinho, checkout, pedidos, cupons e trocas.
                    </p>
                </a>

                <a
                    href="admin/dashboard.html"
                    class="rounded-2xl border bg-white p-6 text-left shadow-sm hover:shadow-md"
                >
                    <div class="text-sm text-slate-500">
                        Visão
                    </div>

                    <div class="mt-1 text-2xl font-black">
                        Administrador
                    </div>

                    <p class="mt-2 text-sm text-slate-600">
                        Clientes, pedidos, trocas e análise de vendas.
                    </p>
                </a>

            </div>

            <button
                id="reset"
                class="mt-6 rounded-xl border bg-white px-4 py-2 text-sm font-semibold"
            >
                Resetar demonstração
            </button>

        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>

</html>
